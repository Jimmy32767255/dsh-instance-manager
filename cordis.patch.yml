# dsh-instance-manager 的 bundle 补丁：把宿主侧挂载为一条 loader 行。
# 包清单里的 `dsh.client` 声明让 client-modules 自动把 lib/client.js 作为该行的浏览器
# 模块提供（不需要单独的 dsh.client 行）。该行加载 dsh-instance-manager（宿主侧），
# 由它在 webserver 上注册 /dsh-instance-manager/api JSON 路由。
- insert:
    - id: instance-manager
      name: dsh-instance-manager
